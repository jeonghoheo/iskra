<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Iskra Headless strategy comparison</title>
  <desc id="desc">거절된 수직 업무 서비스, MausBot형 GUI, Iskra Headless Control Plane을 비교하는 목표 전략 차트</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E1420"/><stop offset="1" stop-color="#171B29"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
    <style>
      text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',Arial,sans-serif;fill:#F6F4EF}
      .muted{fill:#A8B2C5}.dim{fill:#77849A}.orange{fill:#FF8A55}.teal{fill:#56DCC7}.amber{fill:#FFD166}.red{fill:#FF8D98}.blue{fill:#82AEFF}
      .card{fill:#1D2535;stroke:#354158;stroke-width:2}.title{font-size:42px;font-weight:700}.subtitle{font-size:21px}.label{font-size:16px;font-weight:700;letter-spacing:1.5px}.h2{font-size:27px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:15px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1490" cy="870" r="300" fill="#FF8A55" opacity=".04"/>
  <text x="65" y="66" class="label orange">ISKRA / TARGET CONCEPT · NOT IMPLEMENTED</text>
  <text x="65" y="126" class="title">서비스가 아니라, 고객이 호출하는 제품</text>
  <text x="65" y="166" class="subtitle muted">거절된 계획과 Headless 계획의 차이 · MausBot의 사업 구조는 유지</text>

  <g filter="url(#shadow)">
    <rect x="55" y="210" width="470" height="590" rx="24" fill="#251F2B" stroke="#68414C" stroke-width="2"/>
    <rect x="565" y="210" width="470" height="590" rx="24" class="card"/>
    <rect x="1075" y="210" width="470" height="590" rx="24" fill="#202C3E" stroke="#FF8A55" stroke-width="3"/>
  </g>

  <text x="85" y="252" class="label red">REJECTED / SERVICE-FIRST</text>
  <text x="85" y="294" class="h2">Vertical Managed Workflow</text>
  <text x="85" y="334" class="h3 muted">특정 고객의 일을 대신 해결</text>
  <line x1="85" y1="360" x2="495" y2="360" stroke="#68414C"/>
  <text x="85" y="397" class="h3 red">구매자</text><text x="85" y="427" class="body muted">특정 산업의 업무 담당자</text>
  <text x="85" y="474" class="h3 red">Iskra의 위치</text><text x="85" y="504" class="body muted">보이지 않는 내부 엔진</text>
  <text x="85" y="551" class="h3 red">제공 결과</text><text x="85" y="581" class="body muted">업무 해결 서비스 · 운영 대행</text>
  <text x="85" y="628" class="h3 red">수익</text><text x="85" y="658" class="body muted">진단 · 구축 · 월 운영</text>
  <text x="85" y="705" class="h3 red">한계</text><text x="85" y="735" class="body muted">고객마다 다른 컨설팅으로 고착</text>
  <text x="85" y="775" class="small dim">Outcome은 있어도 제품 재사용이 약할 수 있음</text>

  <text x="595" y="252" class="label blue">REFERENCE / GUI WORKBENCH</text>
  <text x="595" y="294" class="h2">MausBot형 Agent 작업대</text>
  <text x="595" y="334" class="h3 muted">Bot과 대화하는 desktop 경험</text>
  <line x1="595" y1="360" x2="1005" y2="360" stroke="#354158"/>
  <text x="595" y="397" class="h3 blue">구매자</text><text x="595" y="427" class="body muted">개인 · 팀의 desktop 사용자</text>
  <text x="595" y="474" class="h3 blue">제품 구조</text><text x="595" y="504" class="body muted">Local 무료 · Cloud · Team</text>
  <text x="595" y="551" class="h3 blue">강점</text><text x="595" y="581" class="body muted">GUI · Bot catalog · 연결된 apps</text>
  <text x="595" y="628" class="h3 blue">Iskra가 가져올 것</text><text x="595" y="658" class="body muted">Always-on 여정과 운영 과금</text>
  <text x="595" y="705" class="h3 blue">한계</text><text x="595" y="735" class="body muted">GUI·connector를 정면 추격하면 열세</text>
  <text x="595" y="775" class="small dim">공개 자료의 중심은 desktop/chat</text>

  <text x="1105" y="252" class="label orange">TARGET / HEADLESS CONTROL PLANE</text>
  <text x="1105" y="294" class="h2">Iskra Outcome Layer</text>
  <text x="1105" y="334" class="h3 muted">고객 software와 Agent가 호출하는 제품</text>
  <line x1="1105" y1="360" x2="1515" y2="360" stroke="#FF8A55"/>
  <text x="1105" y="397" class="h3 orange">구매자</text><text x="1105" y="427" class="body muted">multi-Agent/provider 기술 팀</text>
  <text x="1105" y="474" class="h3 orange">공개 계약</text><text x="1105" y="504" class="body muted">Outcome API · Event · Evidence</text>
  <text x="1105" y="551" class="h3 orange">UI</text><text x="1105" y="581" class="body muted">BYOUI · Web · Chat · CLI · Generated</text>
  <text x="1105" y="628" class="h3 orange">수익</text><text x="1105" y="658" class="body muted">Managed Cloud · Team · Enterprise</text>
  <text x="1105" y="705" class="h3 orange">증명할 가치</text><text x="1105" y="735" class="body muted">반복 Outcome과 managed 운영비</text>
  <text x="1105" y="775" class="small dim">Local · 데이터 주권 · Agent별 실제 권한</text>

  <rect x="55" y="842" width="1490" height="112" rx="22" fill="#17302F" stroke="#56DCC7" stroke-width="2"/>
  <text x="800" y="882" text-anchor="middle" class="h3 teal">DIFFERENTIATION = Headless × Outcome Evidence × Locality × Policy</text>
  <text x="800" y="922" text-anchor="middle" class="body muted">Vercel Board 복제가 아니라 결과·권한·검증·복구 계층 + Cross-provider 평가</text>
</svg>
