<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Iskra Outcome-first operating model</title>
  <desc id="desc">Outcome, Task, Run, Evidence와 Delivery의 관계 및 결과중심 지표를 설명하는 목표 구상도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0E1420"/><stop offset="1" stop-color="#171B29"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#FF8A55"/></marker>
    <style>
      text{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Noto Sans KR',Arial,sans-serif;fill:#F6F4EF}
      .muted{fill:#A8B2C5}.dim{fill:#77849A}.orange{fill:#FF8A55}.teal{fill:#56DCC7}.amber{fill:#FFD166}.green{fill:#78DDA2}.red{fill:#FF8D98}
      .card{fill:#1D2535;stroke:#354158;stroke-width:2}.panel{fill:#151D2B;stroke:#2D394D;stroke-width:2}
      .title{font-size:44px;font-weight:700}.subtitle{font-size:21px}.label{font-size:16px;font-weight:700;letter-spacing:1.5px}.h2{font-size:25px;font-weight:700}.h3{font-size:20px;font-weight:700}.body{font-size:18px}.small{font-size:15px}.mono{font-family:Menlo,monospace;font-size:15px}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="1450" cy="40" r="260" fill="#FF8A55" opacity=".045"/>
  <text x="72" y="68" class="label orange">ISKRA / TARGET CONCEPT · NOT IMPLEMENTED</text>
  <text x="72" y="130" class="title">작업이 아니라, 검증된 결과를 운영한다</text>
  <text x="72" y="170" class="subtitle muted">Outcome-first · 고객의 성공 기준이 실행의 위에 있는 구조</text>

  <g filter="url(#shadow)">
    <rect x="65" y="225" width="330" height="210" rx="22" fill="#263044" stroke="#FF8A55" stroke-width="3"/>
    <rect x="445" y="225" width="300" height="210" rx="22" class="card"/>
    <rect x="795" y="225" width="300" height="210" rx="22" class="card"/>
    <rect x="1145" y="225" width="390" height="210" rx="22" fill="#17302F" stroke="#56DCC7" stroke-width="3"/>
  </g>
  <text x="90" y="265" class="label orange">01 / CUSTOMER RESULT</text>
  <text x="90" y="307" class="h2">Outcome</text>
  <text x="90" y="342" class="body">owner · desired result</text>
  <text x="90" y="372" class="body muted">baseline → target · budget · scope</text>
  <text x="90" y="402" class="body teal">acceptance + required evidence</text>

  <text x="470" y="265" class="label muted">02 / ACTIONABLE UNIT</text>
  <text x="470" y="307" class="h2">Task</text>
  <text x="470" y="342" class="body">실행 가능한 작업</text>
  <text x="470" y="372" class="body muted">의존 관계 · 담당 Agent</text>
  <text x="470" y="402" class="body muted">명확한 입력과 출력</text>

  <text x="820" y="265" class="label muted">03 / ATTEMPT</text>
  <text x="820" y="307" class="h2">Run</text>
  <text x="820" y="342" class="body">한 Agent의 실행 시도</text>
  <text x="820" y="372" class="body muted">claim · lease · cancel</text>
  <text x="820" y="402" class="body muted">모델 · 도구 · 비용</text>

  <text x="1170" y="265" class="label teal">04 / PROOF + ARRIVAL</text>
  <text x="1170" y="307" class="h2">Evidence + Delivery</text>
  <text x="1170" y="342" class="body">Event · Artifact · Verification</text>
  <text x="1170" y="372" class="body muted">client 도착과 delivery 상태 분리</text>
  <text x="1170" y="402" class="body teal">evidence가 있어야 achieved</text>

  <line x1="398" y1="330" x2="433" y2="330" stroke="#FF8A55" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="748" y1="330" x2="783" y2="330" stroke="#FF8A55" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1098" y1="330" x2="1133" y2="330" stroke="#FF8A55" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="65" y="475" width="1470" height="64" rx="16" fill="#312538" stroke="#814A53"/>
  <text x="800" y="515" text-anchor="middle" class="h3"><tspan class="red">Task 완료 ≠ Run 완료 ≠ Outcome 달성</tspan><tspan class="muted"> · acceptance와 증거가 별도로 필요</tspan></text>

  <text x="72" y="590" class="label muted">OUTCOME STATE</text>
  <g class="h3" text-anchor="middle">
    <rect x="70" y="615" width="190" height="58" rx="14" class="panel"/><text x="165" y="652">draft</text>
    <rect x="292" y="615" width="190" height="58" rx="14" class="panel"/><text x="387" y="652">proposed</text>
    <rect x="514" y="615" width="190" height="58" rx="14" class="panel"/><text x="609" y="652">active</text>
    <rect x="736" y="615" width="190" height="58" rx="14" fill="#263044" stroke="#FF8A55" stroke-width="2"/><text x="831" y="652">evaluating</text>
    <rect x="958" y="615" width="190" height="58" rx="14" fill="#17302F" stroke="#56DCC7" stroke-width="2"/><text x="1053" y="652" class="teal">achieved</text>
    <rect x="1180" y="615" width="355" height="58" rx="14" class="panel"/><text x="1358" y="650" class="small muted">blocked · failed · cancelled</text>
  </g>
  <g stroke="#FF8A55" stroke-width="2" marker-end="url(#arrow)">
    <line x1="263" y1="644" x2="284" y2="644"/><line x1="485" y1="644" x2="506" y2="644"/><line x1="707" y1="644" x2="728" y2="644"/><line x1="929" y1="644" x2="950" y2="644"/>
  </g>

  <text x="72" y="735" class="label muted">NORTH STAR — Agent 실행 수가 아니라 검증된 결과</text>
  <g>
    <rect x="65" y="760" width="470" height="88" rx="16" class="card"/><rect x="565" y="760" width="470" height="88" rx="16" class="card"/><rect x="1065" y="760" width="470" height="88" rx="16" class="card"/>
    <rect x="65" y="866" width="470" height="88" rx="16" class="card"/><rect x="565" y="866" width="470" height="88" rx="16" class="card"/><rect x="1065" y="866" width="470" height="88" rx="16" class="card"/>
    <text x="88" y="794" class="h3 orange">Verified Outcome Rate</text><text x="88" y="824" class="small muted">acceptance를 통과한 결과 비율</text>
    <text x="588" y="794" class="h3 orange">Cost / Verified Outcome</text><text x="588" y="824" class="small muted">모델·엔진·infra·사람 개입 포함</text>
    <text x="1088" y="794" class="h3 orange">Time to Verified Outcome</text><text x="1088" y="824" class="small muted">접수 → 증거 확정, p50 / p95</text>
    <text x="88" y="900" class="h3 teal">Unassisted Outcome Rate</text><text x="88" y="930" class="small muted">사람 수정 없이 달성한 비율</text>
    <text x="588" y="900" class="h3 teal">Repeat Outcome Rate</text><text x="588" y="930" class="small muted">같은 workflow의 반복 달성률</text>
    <text x="1088" y="900" class="h3 teal">Outcome Delivery Assurance</text><text x="1088" y="930" class="small muted">결과가 client에 확정 도착한 비율</text>
  </g>
</svg>
